name: snake

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: generate
        uses: Platane/snk@v3
        with:
          github_user_name: tokenbleed
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#e8590c
            dist/github-contribution-grid-snake-dark.svg?color_snake=#ffa94d&color_background=#0d1117&color_dots=#01311f,#034525,#0f6d31,#00c647&color_empty=#161b22
      - name: push output branch
        run: |
          mkdir out && cp dist/*.svg out/
          cd out
          git init -q -b output
          git config user.name tokenbleed
          git config user.email 315635660+tokenbleed@users.noreply.github.com
          git add -A
          git commit -qm "chore: regenerate snake"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/tokenbleed/tokenbleed.git" output
